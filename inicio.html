<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FALTABA: CDN de Bootstrap en el head -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Inicio</title>
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
        <div class="row w-100 justify-content-center">
            
            <!-- Columna que encajona todo el contenido -->
            <div class="col-12 col-md-6 col-lg-4">
                
                <!-- Tarjeta con el estilo crema y sombra que usamos antes -->
                <div class="card border-0 p-4 text-center" style="background-color: #FDFBF7; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35); border-radius: 12px;">
                    <div class="card-body">
                        
                        <!-- Logo con ancho definido (200px) y margen inferior -->
                        <img src="logo.jpeg" class="img-fluid rounded mb-4" alt="Logo de la empresa" style="max-width: 200px;">

                        <!-- Grupo de botones con separación entre ellos (d-grid gap-3) -->
                        <div class="d-grid gap-3">
                            <a href="login.html" class="btn text-white py-2 fw-semibold" style="background-color: rgb(80, 20, 20); border-radius: 6px;">
                                Iniciar Sesión
                            </a>

                            <a href="registro.html" class="btn text-white py-2 fw-semibold" style="background-color: rgb(80, 20, 20); border-radius: 6px;">
                                Registrarse
                            </a>
                        </div>

                    </div>
                </div>

            </div>
            
        </div>
    </div>

</body>
</html>
