<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container-fluid my-3">
        <div class="row">
            <!-- FORMULARIO DE CLIENTES -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white text-center font-weight-bold">
                        REGISTRO DE CLIENTES
                    </div>
                    <div class="card-body">
                        <form id="frmCliente">
                            <div class="mb-2">
                                <input pattern="^[0-9]{3,10}$" required placeholder="Código" name="txtCodigoCliente"
                                    id="txtCodigoCliente" class="form-control" type="text">
                            </div>
                            <div class="mb-2">
                                <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre"
                                    name="txtNombreCliente" id="txtNombreCliente" class="form-control" type="text">
                            </div>
                            <div class="mb-2">
                                <input placeholder="Dirección" name="txtDireccionCliente" id="txtDireccionCliente"
                                    class="form-control" type="text">
                            </div>
                            <div class="mb-2">
                                <input pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Teléfono (ej: 7777-8888)" name="txtTelefonoCliente"
                                    id="txtTelefonoCliente" class="form-control" type="text">
                            </div>
                            <div class="mb-2">
                                <input placeholder="Correo electrónico" name="txtEmailCliente" id="txtEmailCliente"
                                    class="form-control" type="email">
                            </div>
                            <div class="mb-3">
                                <select class="form-select" name="cboTipoPersona" id="cboTipoPersona">
                                    <option value="particular">Particular</option>
                                    <option value="empresa">Empresa</option>
                                </select>
                            </div>
                            <div class="text-center">
                                <input type="submit" value="Guardar Cliente" class="btn btn-primary">
                                <input type="button" value="Buscar" class="btn btn-secondary">
                                <input type="reset" value="Limpiar" class="btn btn-warning">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TABLA DE BÚSQUEDA DE CLIENTES -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-secondary text-white text-center font-weight-bold">
                        BÚSQUEDA DE CLIENTES
                    </div>
                    <div class="card-body p-2">
                        <input type="search" placeholder="Buscar por código o nombre..."
                            id="txtBuscarCliente" name="txtBuscarCliente" class="form-control mb-2">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Código</th>
                                        <th>Nombre</th>
                                        <th>Dirección</th>
                                        <th>Teléfono</th>
                                        <th>Email</th>
                                        <th>Tipo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tblClientes"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-4">

        <!-- NUEVA SECCIÓN: GESTIÓN DE BALANCES DE USUARIOS Y FECHAS -->
        <div class="row">
            <!-- FORMULARIO PARA REGISTRAR BALANCE -->
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header bg-success text-white text-center font-weight-bold">
                        REGISTRO DE BALANCES
                    </div>
                    <div class="card-body">
                        <form id="frmBalance">
                            <div class="mb-2">
                                <label for="cboClienteBalance" class="form-label mb-1">Cliente:</label>
                                <select class="form-select" required id="cboClienteBalance" name="cboClienteBalance">
                                    <option value="">-- Seleccionar Cliente --</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label for="txtMontoBalance" class="form-label mb-1">Monto ($):</label>
                                <input type="number" step="0.01" required placeholder="0.00" name="txtMontoBalance"
                                    id="txtMontoBalance" class="form-control">
                            </div>
                            <div class="mb-2">
                                <label for="txtFechaBalance" class="form-label mb-1">Fecha y Hora:</label>
                                <input type="datetime-local" required name="txtFechaBalance" id="txtFechaBalance"
                                    class="form-control">
                            </div>
                            <div class="mb-3">
                                <label for="txtConceptoBalance" class="form-label mb-1">Concepto / Observación:</label>
                                <input type="text" placeholder="Ej: Declaración mensual de ingresos"
                                    name="txtConceptoBalance" id="txtConceptoBalance" class="form-control">
                            </div>
                            <div class="text-center">
                                <input type="submit" value="Guardar Balance" class="btn btn-success">
                                <input type="reset" value="Limpiar" class="btn btn-warning">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TABLA DE HISTORIAL DE BALANCES -->
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header bg-dark text-white text-center font-weight-bold">
                        HISTORIAL DE BALANCES POR USUARIO / FECHA
                    </div>
                    <div class="card-body p-2">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Cliente</th>
                                        <th>Monto</th>
                                        <th>Fecha y Hora</th>
                                        <th>Concepto</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tblBalances"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var accion = 'nuevo',
            idCliente = '',
            accionBalance = 'nuevo',
            idBalance = '';

        // Eventos para Clientes
        frmCliente.addEventListener('submit', (e) => {
            e.preventDefault();
            guardarClientes();
        });
        frmCliente.addEventListener('reset', (e) => {
            e.preventDefault();
            limpiarFormulario();
        });
        txtBuscarCliente.addEventListener('keyup', (e) => {
            e.preventDefault();
            obtenerClientes(txtBuscarCliente.value);
        });

        // Eventos para Balances
        frmBalance.addEventListener('submit', (e) => {
            e.preventDefault();
            guardarBalance();
        });
        frmBalance.addEventListener('reset', (e) => {
            e.preventDefault();
            limpiarFormularioBalance();
        });

        // Carga inicial al abrir la página
        document.addEventListener("DOMContentLoaded", () => {
            obtenerClientes();
            obtenerBalances();
            establecerFechaActual();
        });

        function establecerFechaActual() {
            let now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            txtFechaBalance.value = now.toISOString().slice(0, 16);
        }

        // ---------- CLIENTES ----------
        async function obtenerClientes(buscar = "") {
            let response = await fetch(`/clientes?buscar=${buscar}`),
                datos = await response.json();
            mostrarDatos(datos);
            poblarSelectClientes(datos);
        }

        function mostrarDatos(datos) {
            let filas = "";
            datos.forEach(e => {
                filas += `
                    <tr onClick='modificarCliente(${JSON.stringify(e)}, event)'>
                        <td>${e.codigo}</td>
                        <td>${e.nombre}</td>
                        <td>${e.direccion}</td>
                        <td>${e.telefono}</td>
                        <td>${e.email}</td>
                        <td>${e.tipo}</td>
                        <td>
                            <input onClick='eliminarCliente(${JSON.stringify(e)}, event)' 
                                type="button" value="DEL" class="btn btn-danger btn-sm"/>
                        </td>
                    </tr>
                `;
            });
            tblClientes.innerHTML = filas;
        }

        function poblarSelectClientes(datos) {
            let opciones = '<option value="">-- Seleccionar Cliente --</option>';
            datos.forEach(c => {
                opciones += `<option value="${c.idCliente}">${c.codigo} - ${c.nombre}</option>`;
            });
            cboClienteBalance.innerHTML = opciones;
        }

        function modificarCliente(data, event) {
            event.preventDefault();
            idCliente = data.idCliente;
            accion = "modificar";

            txtCodigoCliente.value = data.codigo;
            txtNombreCliente.value = data.nombre;
            txtDireccionCliente.value = data.direccion;
            txtTelefonoCliente.value = data.telefono;
            txtEmailCliente.value = data.email;
            cboTipoPersona.value = data.tipo;
        }

        function eliminarCliente(data, event) {
            event.stopPropagation();
            if (confirm(`¿Seguro de eliminar al cliente: ${data.nombre}?`)) {
                idCliente = data.idCliente;
                accion = "eliminar";
                guardarClientes();
            }
        }

        async function guardarClientes() {
            let datos = {
                codigo: txtCodigoCliente.value,
                nombre: txtNombreCliente.value,
                direccion: txtDireccionCliente.value,
                telefono: txtTelefonoCliente.value,
                email: txtEmailCliente.value,
                tipo: cboTipoPersona.value,
                accion,
                idCliente
            };
            let response = await fetch('/cliente', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            }), respuesta = await response.json();

            if (respuesta.msg != "ok") {
                alert("Error: " + respuesta.msg);
                return;
            }
            obtenerClientes();
            limpiarFormulario();
        }

        function limpiarFormulario() {
            accion = 'nuevo';
            idCliente = '';
            txtCodigoCliente.value = '';
            txtNombreCliente.value = '';
            txtDireccionCliente.value = '';
            txtTelefonoCliente.value = '';
            txtEmailCliente.value = '';
            cboTipoPersona.value = 'particular';
        }

        // ---------- BALANCES ----------
        async function obtenerBalances() {
            let response = await fetch('/balances'),
                datos = await response.json();
            mostrarBalances(datos);
        }

        function mostrarBalances(datos) {
            let filas = "";
            datos.forEach(b => {
                filas += `
                    <tr>
                        <td>${b.idBalance}</td>
                        <td>${b.cliente_nombre || 'ID: ' + b.idCliente}</td>
                        <td>$${parseFloat(b.monto).toFixed(2)}</td>
                        <td>${b.fecha}</td>
                        <td>${b.concepto || '-'}</td>
                        <td>
                            <input onClick='eliminarBalance(${b.idBalance})' 
                                type="button" value="DEL" class="btn btn-danger btn-sm"/>
                        </td>
                    </tr>
                `;
            });
            tblBalances.innerHTML = filas;
        }

        async function guardarBalance() {
            let datos = {
                accion: accionBalance,
                idBalance: idBalance,
                idCliente: cboClienteBalance.value,
                monto: txtMontoBalance.value,
                fecha: txtFechaBalance.value,
                concepto: txtConceptoBalance.value
            };

            let response = await fetch('/balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            }), respuesta = await response.json();

            if (respuesta.msg != "ok") {
                alert("Error al guardar balance: " + respuesta.msg);
                return;
            }
            obtenerBalances();
            limpiarFormularioBalance();
        }

        async function eliminarBalance(id) {
            if (confirm("¿Deseas eliminar este registro de balance?")) {
                let datos = { accion: 'eliminar', idBalance: id };
                let response = await fetch('/balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                }), respuesta = await response.json();

                if (respuesta.msg == "ok") {
                    obtenerBalances();
                } else {
                    alert("Error: " + respuesta.msg);
                }
            }
        }

        function limpiarFormularioBalance() {
            accionBalance = 'nuevo';
            idBalance = '';
            cboClienteBalance.value = '';
            txtMontoBalance.value = '';
            txtConceptoBalance.value = '';
            establecerFechaActual();
        }
    </script>
</body>

</html>
